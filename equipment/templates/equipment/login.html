{% extends 'equipment/base.html' %}

{% block title %}Đăng nhập{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h2 class="text-center mb-4">Đăng nhập hệ thống</h2>

            {% if form.errors %}
                <div class="alert alert-danger">Tên đăng nhập hoặc mật khẩu không đúng. Vui lòng thử lại.</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Tên đăng nhập</label>
                    {{ form.username }}
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    {{ form.password }}
                </div>
                <button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
            </form>

            <div class="text-center mt-3">
                <a href="{% url 'equipment_list' %}" class="text-decoration-none">Quay lại trang chủ</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
