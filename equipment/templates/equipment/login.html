<!DOCTYPE html>
<html>
<head>
    <title>Đăng nhập - Lab Manager</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; border: 1px solid #ccc; padding: 20px;">
    <h2 style="text-align: center;">Đăng nhập hệ thống</h2>
    
    <!-- Hiện lỗi nếu sai pass -->
    {% if form.errors %}
        <p style="color: red;">Tên đăng nhập hoặc mật khẩu không đúng. Vui lòng thử lại.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <p>
            <label>Tên đăng nhập:</label><br>
            {{ form.username }}
        </p>
        <p>
            <label>Mật khẩu:</label><br>
            {{ form.password }}
        </p>
        <button type="submit" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none;">
            Đăng nhập
        </button>
    </form>
    <p style="text-align: center;"><a href="{% url 'equipment_list' %}">Quay lại trang chủ</a></p>
</body>
</html>
