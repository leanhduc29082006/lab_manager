{% extends 'equipment/base.html' %}

{% block title %}Mượn thiết bị{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card p-4">
            <h2 class="mb-3">Đăng ký mượn thiết bị</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Thiết bị</label>
                    {{ form.equipment }}
                </div>
                <div class="mb-3">
                    <label class="form-label">Ngày hẹn trả</label>
                    {{ form.expected_return_date }}
                </div>
                <div class="d-flex justify-content-between align-items-center">
                    <a href="{% url 'equipment_list' %}" class="btn btn-outline-secondary">Hủy bỏ</a>
                    <button type="submit" class="btn btn-success">Xác nhận mượn</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
