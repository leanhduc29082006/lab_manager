<!DOCTYPE html>
<html>
<head>
    <title>Mượn thiết bị</title>
</head>
<body style="font-family: Arial, sans-serif; max-width: 500px; margin: 50px auto;">
    <h2>Đăng ký mượn thiết bị</h2>
    
    <form method="POST" style="border: 1px solid #ddd; padding: 20px;">
        {% csrf_token %}
        <!-- form.as_p tự động in ra các trường trong BorrowForm -->
        {{ form.as_p }}
        
        <button type="submit" style="background-color: green; color: white; padding: 8px 15px; border: none; cursor: pointer;">
            Xác nhận mượn
        </button>
        <a href="{% url 'equipment_list' %}" style="margin-left: 10px;">Hủy bỏ</a>
    </form>
</body>
</html>
